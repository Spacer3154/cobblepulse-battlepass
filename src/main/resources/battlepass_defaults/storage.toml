# =====================================================================
#  CobblePulse Passe de Combat - Stockage des donnees joueurs
#  Changer de mode necessite un redemarrage du serveur.
# =====================================================================

# "json"   : fichiers locaux (par defaut) : config/cobblepulse_battlepass/data/players/[uuid].json
#            Ecritures atomiques (.tmp puis renommage) contre la corruption.
# "mysql"  : base MySQL/MariaDB (pool HikariCP)
# "sqlite" : fichier local config/cobblepulse_battlepass/data/battlepass.db
# En mysql/sqlite, les tables sont cp_bp_players et cp_bp_kv.
# Les reglages (saison.json, recompenses.json, quetes.json, chasses.json) restent toujours des fichiers.
mode = "json"

[mysql]
# true : reprend host/port/base/identifiants de config/cobblepulse/storage.toml (meme instance que CobblePulse)
share_cobblepulse = false
host = "localhost"
port = 3306
database = "cobblepulse"
username = "root"
password = ""
use_ssl = false
pool_size = 4
table_prefix = "cp_bp_"

[sqlite]
file = "data/battlepass.db"
